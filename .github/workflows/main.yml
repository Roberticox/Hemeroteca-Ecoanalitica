name: Actualizador de Hemeroteca

# Ejecuta el script a cada hora en punto y permite correrlo manualmente
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar el script de la Hemeroteca
        run: python actualizar_hemeroteca.py

      - name: Guardar los nuevos artículos en index.html
        run: |
          git config --global user.name "Hemeroteca Bot"
          git config --global user.email "bot@ecoanalitica.com"
          git add index.html
          git commit -m "Actualización automática de noticias" || exit 0
          git push
